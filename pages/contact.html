<!doctype html>
<html lang="en">
  <head>
    <base href="../" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact – Mayor Official Website</title>
    <meta name="description" content="Official website of the Mayor (demo)" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Yatra+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="site-header"></div>
    <main id="main">
      <section>
        <div class="wrap"><h1>Contact</h1></div>
      </section>
      <section class="alt">
        <div class="wrap two">
          <div class="card">
            <p>📍 [Office Address]</p>
            <p>📞 [Phone]</p>
            <p>✉ [Official email]</p>
            <p>🕒 Sun–Fri, 10:00–5:00</p>
            <p>Social: <a href="#">Facebook</a> (add link)</p>
          </div>
          <iframe
            title="Map"
            style="width: 100%; height: 350px; border: 0; border-radius: 14px"
            loading="lazy"
            src="https://www.google.com/maps?q=Kathmandu&output=embed"
          ></iframe>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/data.js"></script>
    <script src="js/language.js"></script>
    <script src="js/vendor/nepali-date-converter.umd.js"></script>
    <script src="js/main.js"></script>
    <script src="js/calendar.js"></script>
  </body>
</html>
